name: Build Kontur
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile launcher
        shell: powershell
        run: ./scripts/build.ps1
      - name: Verify profiles and UI
        shell: powershell
        run: ./scripts/test.ps1
      - name: Build single executable
        shell: powershell
        run: ./scripts/build-single.ps1
      - name: Verify embedded application
        shell: powershell
        run: ./scripts/test-single.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kontur-single-exe-win-x64
          path: |
            dist/Kontur.exe
            dist/Kontur.exe.sha256
