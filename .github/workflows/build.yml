name: Build Kontur
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile launcher
        shell: powershell
        run: ./scripts/build.ps1
      - name: Verify profiles and UI
        shell: powershell
        run: ./scripts/test.ps1
      - name: Package portable application
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kontur-win-x64
          path: dist/Kontur-1.0.0-win-x64.zip
